<style>
/* light is the base; the app follows the system unless a theme is chosen */
:root{
--chalk:#DDE1DC;--card:#EFF1ED;--ink:#16211C;--soft:rgba(22,33,28,.74);
--ox:#8C2F1E;--turf:#1F3D2E;--brass:#6F5514;--line:rgba(22,33,28,.20);
--disp:Impact,"Haettenschweiler","Arial Narrow",sans-serif;
--body:"Helvetica Neue",Helvetica,Arial,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--tt:uppercase;--tls:.02em;--onox:#EFF1ED;
color-scheme:light;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme]){
 --chalk:#14171A;--card:#1E2227;--ink:#E7EBE8;--soft:rgba(231,235,232,.74);
 --ox:#F0784A;--turf:#6FC28C;--brass:#E0B44E;--line:rgba(231,235,232,.20);--onox:#14171A;
 color-scheme:dark;
 }
}
[data-theme="track"]{
--chalk:#DDE1DC;--card:#EFF1ED;--ink:#16211C;--soft:rgba(22,33,28,.74);
--ox:#8C2F1E;--turf:#1F3D2E;--brass:#6F5514;--line:rgba(22,33,28,.20);
--disp:Impact,"Haettenschweiler","Arial Narrow",sans-serif;--tt:uppercase;--tls:.02em;--onox:#EFF1ED;
color-scheme:light;
}
/* Carbon — always dark */
[data-theme="carbon"]{
--chalk:#14171A;--card:#1E2227;--ink:#E7EBE8;--soft:rgba(231,235,232,.74);
--ox:#F0784A;--turf:#6FC28C;--brass:#E0B44E;--line:rgba(231,235,232,.20);
--disp:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--tls:.06em;--onox:#14171A;
color-scheme:dark;
}
/* Press — warm paper and serif */
[data-theme="press"]{
--chalk:#F3EFE6;--card:#FEFCF6;--ink:#1B1A17;--soft:rgba(27,26,23,.74);
--ox:#94202A;--turf:#2C4739;--brass:#6E5326;--line:rgba(27,26,23,.18);
--disp:Georgia,"Times New Roman",serif;--tt:none;--tls:-.01em;--onox:#FEFCF6;
color-scheme:light;
}
/* Court — cool and clinical */
[data-theme="court"]{
--chalk:#E3E8EC;--card:#F5F7F9;--ink:#152029;--soft:rgba(21,32,41,.74);
--ox:#C24708;--turf:#1B4A66;--brass:#6E5700;--line:rgba(21,32,41,.18);
--disp:"Arial Black","Helvetica Neue",Helvetica,sans-serif;--tls:-.02em;--onox:#F5F7F9;
color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--chalk);color:var(--ink)}
html,body{margin:0;padding:0}
body{background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom));
background:var(--chalk);color:var(--ink);min-height:100vh;min-height:100dvh}
#surface{background:var(--chalk);color:var(--ink);min-height:100vh;min-height:100dvh}
header{padding:calc(18px + env(safe-area-inset-top)) 0 10px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--disp);text-transform:var(--tt);letter-spacing:var(--tls);font-size:30px;letter-spacing:.02em;margin:0;line-height:1}
h1 em{font-style:normal;color:var(--ox)}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ox);margin:6px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;appearance:none;background:none;border:0;border-top:4px solid transparent;
padding:11px 2px 12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
color:var(--soft);cursor:pointer;margin-top:-2px}
nav button b{display:block;font-family:var(--disp);font-size:17px;letter-spacing:.02em;font-weight:400}
nav button[aria-current="true"]{color:var(--ox);border-top-color:var(--ox)}
section{display:none;padding-top:14px}section.on{display:block}
h2{font-family:var(--disp);text-transform:var(--tt);font-size:22px;margin:0 0 4px;letter-spacing:.02em}
.hint{font-size:13px;color:var(--soft);margin:0 0 14px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
label.sel{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
display:flex;align-items:center;gap:7px}
select{appearance:none;background:var(--card);border:1.5px solid var(--ink);border-radius:0;
font-family:var(--disp);font-size:17px;letter-spacing:.02em;color:var(--ink);padding:7px 12px;cursor:pointer}
.sess{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--turf);padding:13px 14px;margin-bottom:12px}
.sess.trk{border-left-color:var(--ox)}
.sess h3{font-family:var(--disp);text-transform:var(--tt);font-size:20px;margin:0 0 2px;letter-spacing:.02em}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--onox);
background:var(--turf);padding:3px 7px}
.sess.trk .badge{background:var(--ox)}
.seg{border-top:1px solid var(--line);padding:10px 0 4px}
.seg:first-of-type{border-top:0}
.seg h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);
margin:0 0 6px;font-weight:400}
.seg h4 i{font-style:normal;color:var(--turf)}
.ex{padding:5px 0;border-bottom:1px dotted rgba(22,33,28,.14)}
.ex:last-child{border-bottom:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exn{font-size:14px}
.exp{font-family:var(--mono);font-size:11.5px;color:var(--turf);white-space:nowrap}
.tgt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--brass);margin-top:3px}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 3px}
.sets label{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:8px;
letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
input[type=text],input[type=date],textarea{background:transparent;border:1px solid var(--line);
border-bottom:1.5px solid rgba(22,33,28,.35);font-family:var(--mono);font-size:14px;color:var(--ink);
border-radius:0;padding:8px 6px;-webkit-appearance:none}
.sets input{width:60px;text-align:center}
input:focus,textarea:focus{outline:none;border-color:var(--ox);background:var(--card)}
input:not(:placeholder-shown){background:var(--card);border-bottom-color:var(--turf)}
.prev{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:4px}
.prev b{color:var(--turf);font-weight:400}
textarea{width:100%;min-height:60px;font-family:var(--body);font-size:14px;resize:vertical}
.done{display:flex;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
button.act{appearance:none;background:transparent;border:1.5px solid var(--ink);border-radius:0;
font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
padding:10px 14px;cursor:pointer}
button.act[aria-pressed="true"]{background:var(--turf);color:var(--onox);border-color:var(--turf)}
button.act.warn{border-color:var(--ox);color:var(--ox)}
.lane{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:4px 0 10px}
.lane div{display:flex;flex-direction:column;gap:2px}
.lane i{height:8px;background:rgba(22,33,28,.11);border-radius:1px;display:block}
.lane i.on{background:var(--turf)}
.lane i.on.t{background:var(--ox)}
.lane span{font-family:var(--mono);font-size:7px;color:var(--soft);text-align:center;margin-top:3px}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
.stat b{font-family:var(--disp);font-size:24px;color:var(--ink);letter-spacing:.02em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
text-align:left;font-weight:400;padding:6px 4px;border-bottom:1.5px solid var(--ink)}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:100%;font-size:13px;padding:7px 5px}
td.nm{font-size:13px}
td .u{font-family:var(--mono);font-size:9px;color:var(--soft);display:block}
.chart{background:var(--card);border:1px solid var(--line);padding:11px 12px;margin-bottom:12px}
.chart h5{font-family:var(--disp);text-transform:var(--tt);font-size:16px;margin:0 0 2px;letter-spacing:.02em}
.chart p{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
.chart svg{width:100%;height:auto;display:block}
.note{font-size:12.5px;color:var(--soft);margin:8px 0 0}
.saved{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
min-height:14px;margin:8px 0 0}
.warnbox{border:1px solid var(--ox);border-left:4px solid var(--ox);background:var(--card);padding:11px 13px;margin:14px 0}
.warnbox p{margin:0 0 6px;font-size:13px;color:var(--ink)}
.warnbox p:last-child{margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));
display:none;align-items:center;gap:10px;padding:9px 16px;background:var(--turf);
color:var(--onox);z-index:25}
.rest.on{display:flex}
.rest.go{background:var(--ox)}
.rest b{font-family:var(--disp);font-size:26px;letter-spacing:.02em;line-height:1}
.rest span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;flex:1}
.rest button{appearance:none;background:transparent;border:1px solid currentColor;
color:var(--onox);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
padding:7px 10px;border-radius:0;cursor:pointer}
/* set rows */
.setrow{display:flex;align-items:flex-end;gap:7px;margin:6px 0}
.setn{font-family:var(--mono);font-size:10px;color:var(--soft);width:14px;padding-bottom:11px;flex:0 0 14px}
.setrow label{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:8px;
letter-spacing:.07em;text-transform:uppercase;color:var(--soft);flex:1;min-width:0}
.setrow label i{font-style:normal;color:var(--turf)}
.setrow input{width:100%;text-align:center}
.tgt{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--brass);margin:4px 0 0}
.cue{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ox);margin:4px 0 0;
border-left:2px solid var(--ox);padding-left:7px}
.exact{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.mini{appearance:none;background:transparent;border:1px solid var(--line);border-radius:0;
font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
color:var(--soft);padding:7px 9px;cursor:pointer}
.mini.rest{position:static;display:inline-block;background:transparent;color:var(--turf);border-color:var(--turf)}
.mini.warn{color:var(--ox);border-color:var(--ox)}
.hist{border-top:1px dotted rgba(22,33,28,.2);margin-top:7px;padding-top:6px}
.histr{font-family:var(--mono);font-size:10.5px;color:var(--soft);padding:2px 0}
.histr b{color:var(--ink);font-weight:400}
.addex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addex input{flex:1 1 140px;font-family:var(--body);font-size:14px}
.addex select{font-family:var(--body);font-size:12px;padding:7px 8px}
/* guide */
.search{width:100%;margin-bottom:12px;font-family:var(--body);font-size:15px}
.gcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--turf);
padding:12px 13px;margin-bottom:10px}
.gcard h5{font-family:var(--disp);text-transform:var(--tt);font-size:17px;margin:0 0 6px;letter-spacing:.02em}
.grow{display:grid;grid-template-columns:60px 1fr;gap:9px;padding:3px 0;align-items:baseline}
.gw{border-top:1px dotted rgba(22,33,28,.18);margin-top:4px;padding-top:6px}
.gn{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--turf);line-height:1.6}
.gw .gn{color:var(--ox)}
.gt{font-size:13px;color:var(--soft);line-height:1.45}
.gw .gt{color:var(--ink)}
.gv{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
text-transform:uppercase;color:var(--ox);text-decoration:none;border-bottom:1px solid var(--ox);padding-bottom:2px}
@media(max-width:400px){.grow{grid-template-columns:1fr;gap:0}}
.figsvg{width:100%;max-width:320px;height:auto;display:block;margin:2px 0 8px}
.gcard .figsvg{max-width:300px}
.seg.warm{opacity:.82}
.wtag{font-style:normal;color:var(--brass);font-size:8.5px;letter-spacing:.12em}
/* extras */
.pr{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
text-transform:uppercase;color:var(--onox);background:var(--ox);padding:3px 6px;margin-left:5px;vertical-align:2px}
.rmnudge{background:var(--card);border:1px solid var(--ox);border-left:4px solid var(--ox);
padding:11px 13px;margin-bottom:12px}
.rmnudge p{margin:0 0 8px;font-size:13.5px}
.rmnudge b{font-family:var(--mono);font-size:12px;color:var(--ox)}
.clock{display:flex;align-items:baseline;gap:9px;margin:8px 0 2px;flex-wrap:wrap}
.clock b{font-family:var(--disp);font-size:26px;letter-spacing:var(--tls);line-height:1}
.clock span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.clock.over b{color:var(--ox)}
.themes{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 4px}
.themes button{flex:1 1 auto;min-width:88px;appearance:none;border:1.5px solid var(--line);
background:var(--card);border-radius:0;padding:10px 8px;cursor:pointer;
font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.themes button[aria-pressed="true"]{border-color:var(--ox);color:var(--ox)}
.themes button i{display:block;height:6px;margin-bottom:7px}
.swaptag{font-style:normal;color:var(--ox);font-family:var(--mono);font-size:8px;
letter-spacing:.1em;text-transform:uppercase;margin-left:6px;vertical-align:1px}
.lhbtn{appearance:none;background:transparent;border:0;border-bottom:1px dotted var(--brass);
color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:0 0 2px;cursor:pointer}
.lh{border:1px solid var(--line);border-left:3px solid var(--brass);background:var(--card);
padding:9px 11px;margin:7px 0 4px}
.lhh{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
color:var(--soft);margin:6px 0 4px}
.lhh:first-child{margin-top:0}
.lhr{display:grid;grid-template-columns:64px 34px 1fr;gap:8px;align-items:baseline;padding:2px 0}
.lhr b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:400}
.lhr.top b{color:var(--ox)}
.lhr span{font-family:var(--mono);font-size:10px;color:var(--soft)}
.lhr i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--turf)}
.lhn{font-size:11.5px;color:var(--soft);margin:7px 0 0}
.exnote{width:100%;min-height:52px;margin-top:7px;font-family:var(--body);font-size:13.5px}
.lqn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
color:var(--ox);margin:12px 0 2px}
select[data-rd]{font-family:var(--mono);font-size:12px;padding:6px 7px;width:100%}
td select{width:100%}

/* --- readability and tap targets --- */
input[type=text],input[type=date],textarea,select{font-size:16px!important;min-height:46px}
textarea{min-height:64px}
.sets input,.setrow input{font-size:16px!important}
nav button{padding:12px 2px 14px;font-size:10px;min-height:56px}
nav button b{font-size:18px}
.mini{font-size:10.5px;padding:12px 12px;min-height:44px}
button.act{font-size:11px;padding:13px 16px;min-height:46px}
.setrow label{font-size:10px}
.setn{font-size:12px;width:18px;flex:0 0 18px}
.exn{font-size:15px;line-height:1.35}
.exp{font-size:12.5px}
.tgt,.cue{font-size:12px}
.lhbtn{font-size:12px;padding:8px 0;min-height:38px}
.lhr b{font-size:14.5px}.lhr i{font-size:12px}.lhr span{font-size:11.5px}
.lhh{font-size:10px}.lhn{font-size:12.5px}
.prev,.histr,.lexlast{font-size:12px}
.gn{font-size:10px}.gt{font-size:14px}
.seg h4{font-size:11px}
.hint,.note{font-size:14px}
.badge{font-size:10.5px;padding:4px 8px}
.themes button{font-size:10.5px;padding:14px 8px;min-height:56px}
.rest button{font-size:10.5px;padding:11px 13px;min-height:42px}
.rest b{font-size:30px}.rest span{font-size:10.5px}
th{font-size:10.5px}td,td.nm{font-size:14px}
td .u{font-size:10.5px}
.pr{font-size:9.5px;padding:3px 6px}
.lqn{font-size:11px}
.clock b{font-size:30px}.clock span{font-size:10.5px}
.exact{gap:8px}
.more{display:none}
.more.on{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:380px){.setrow{flex-wrap:wrap}.setrow label{flex:1 1 44%}}
.cwarn{border:1px solid var(--ox);border-left:4px solid var(--ox);background:var(--card);
padding:12px 13px;margin:12px 0}
.cwarn p{margin:0 0 10px;font-size:14px;color:var(--ink)}
/* accordion */
.ex{border-bottom:1px dotted var(--line);padding:0}
.ex:last-child{border-bottom:0}
.exhead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
appearance:none;background:transparent;border:0;border-radius:0;text-align:left;
padding:14px 2px;cursor:pointer;color:inherit;min-height:56px}
.ex.open .exhead{padding-bottom:6px}
.ex.full .exn{opacity:.55}
.exmeta{display:flex;align-items:center;gap:9px;flex-shrink:0}
.dot{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--soft);
border:1px solid var(--line);padding:4px 7px;min-width:44px;text-align:center;font-weight:400}
.dot.p{color:var(--brass);border-color:var(--brass)}
.dot.f{color:var(--onox);background:var(--turf);border-color:var(--turf)}
.exhead .exp{display:none}
@media(min-width:520px){.exhead .exp{display:inline}}
.ex.open{background:var(--card);margin:0 -10px;padding:0 10px 10px}
/* session progress */
.prog{height:5px;background:var(--line);margin:12px 0 5px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--turf);transition:width .25s ease}
.progn{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
color:var(--soft);margin:0}
/* summary card */
.sumcard{border:1px solid var(--turf);border-left:4px solid var(--turf);background:var(--card);
padding:14px 15px;margin-bottom:14px}
.sumcard h4{font-family:var(--disp);text-transform:var(--tt);font-size:20px;margin:0 0 10px;
letter-spacing:var(--tls);color:var(--ink)}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
@media(min-width:460px){.sumgrid{grid-template-columns:repeat(4,1fr)}}
.sumgrid b{display:block;font-family:var(--disp);font-size:27px;line-height:1;letter-spacing:var(--tls);color:var(--ink)}
.sumgrid b i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--soft);margin-left:3px}
.sumgrid span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sumbar{height:5px;background:var(--line);margin:13px 0 4px;border-radius:3px;overflow:hidden}
.sumbar i{display:block;height:100%;background:var(--turf)}
.sumh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
color:var(--ox);margin:14px 0 4px}
.sumr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;
border-bottom:1px dotted var(--line);font-size:13.5px}
.sumr:last-child{border-bottom:0}
.sumr b{font-weight:600;color:var(--ink)}
.sumr span{font-family:var(--mono);font-size:12.5px;color:var(--turf);text-align:right}
.sumn{font-size:13px;color:var(--soft);margin:11px 0 0}
/* 16-week overview */
.blkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
border-top:2px solid var(--ink);padding:14px 0 3px;margin-top:6px}
.blkhead b{font-family:var(--disp);text-transform:var(--tt);font-size:19px;letter-spacing:var(--tls)}
.blkhead span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ox)}
.wkrow{display:grid;grid-template-columns:38px 1fr 62px;gap:9px;align-items:center;
padding:7px 0;border-bottom:1px solid var(--line)}
.wkno{font-family:var(--mono);font-size:11px;color:var(--soft)}
.wkno b{display:block;font-family:var(--disp);font-size:19px;color:var(--ink);letter-spacing:var(--tls)}
.wkcells{display:flex;gap:6px}
.wkcell{flex:1;appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:0;
min-height:46px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.wkcell u{text-decoration:none;font-size:8.5px;opacity:.7}
.wkcell.trk{border-color:var(--ox);color:var(--ox)}
.wkcell.part{border-color:var(--brass);color:var(--brass)}
.wkcell.done{background:var(--turf);border-color:var(--turf);color:var(--onox)}
.wkcell.trk.done{background:var(--ox);border-color:var(--ox)}
.wkcell.now{outline:2px solid var(--ink);outline-offset:2px}
.wkton{font-family:var(--mono);font-size:11px;color:var(--turf);text-align:right}
.wkrow.deload{opacity:.72}
.ovstat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 4px}
.ovstat div b{display:block;font-family:var(--disp);font-size:27px;line-height:1;letter-spacing:var(--tls);color:var(--ink)}
.ovstat div b i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--soft);margin-left:3px}
.ovstat div span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}

":4,"c":["Weighted pull-up",1.0,0],"a":1,"g":"Weighted pull-up"},{"n":"DB row","p":"3 × 8","k":"load","s":3,"r":8,"c":["Barbell deadlift",0.25,1]}]},{"h":"Engine","t":"22 min","w":0,"i":[{"n":"Ski or row, 60 s rest — faster than race split","p":"8 × 250 m","k":"erg_d","s":8}]},{"h":"Pull","t":"8 min","w":0,"i":[{"n":"Lat pulldown or seated cable row","p":"3 × 12","k":"load","s":3,"r":12,"c":["Barbell deadlift",0.5,0]}]}]},{"n":"Day 3","ti":"Agility at Speed + Power","w":"Gym","tr":false,"s":[{"h":"Warm-up","t":"12 min","w":1,"i":[{"n":"Dynamic circuit + wall drive quick feet","p":"12 min","k":"hold","s":1}]},{"h":"Agility — on the mat","t":"12 min","w":0,"i":[{"n":"Dot drill, timed, full recovery","p":"3 × 20 s","k":"drill_t","s":3,"g":"Dot drill"},{"n":"Reactive wall catch","p":"4 reps","k":"drill_r","s":1,"g":"Reactive wall catch"},{"n":"Hip turn, both directions","p":"3 × 4","k":"drill_r","s":3,"r":4,"g":"Hip turn"}]},{"h":"Power","t":"22 min","w":0,"i":[{"n":"DB snatch","p":"4 × 2/arm","k":"load","s":4,"r":2,"c":["Barbell deadlift",0.18,0],"g":"DB snatch"},{"n":"KB swing, heavy","p":"3 × 6","k":"load","s":3,"r":6,"c":["Barbell deadlift",0.2,0]},{"n":"Split squat","p":"2 × 8/leg","k":"load","s":2,"r":8,"c":["Back squat",0.32,1],"g":"Split squat"}]},{"h":"Circuit — 2 rounds","t":"10 min","w":0,"i":[{"n":"DB thruster","p":"15","k":"load","s":1,"c":["Push press",0.3,1]},{"n":"Step-back burpee","p":"8","k":"bw","s":1,"a":1,"g":"Step-back burpee"},{"n":"Row","p":"250 m","k":"erg_d","s":1}]}]},{"n":"Day 4","ti":"Race Pace","w":"Track","tr":true,"s":[{"h":"Warm-up","t":"12 min","w":1,"i":[{"n":"Jog + drills + build-ups","p":"12 min","k":"hold","s":1}]},{"h":"Speed","t":"18 min","w":0,"i":[{"n":"Flying 20s, full recovery","p":"3 × @ 100%","g":"Flying 20"},{"n":"Acceleration","p":"3 × 20 m","k":"run_d","s":3}]},{"h":"Change of direction","t":"8 min","w":0,"i":[{"n":"5-10-5, timed, full recovery","p":"3 reps","k":"drill_t","s":1},{"n":"L-drill","p":"2 reps","k":"drill_t","s":1,"g":"L-drill"}]},{"h":"Main set","t":"35 min","w":0,"i":[{"n":"Run at goal pace, 60 m lunge between reps","p":"3 × 1 km","k":"run_d","s":3}]},{"h":"Cool-down","t":"10 min","w":1,"i":[{"n":"Walk + mobility","p":"10 min","k":"hold","s":1}]}]}]}],"L":{"Back squat":[68,70,72,60,78,80,82,65,85,86,87,65,87,88,88,60],"Barbell deadlift":[65,68,70,58,76,78,80,62,82,84,85,62,85,86,86,58],"Bench press":[68,70,72,60,78,80,82,65,85,86,87,65,87,88,88,60],"Push press":[66,68,70,58,76,78,80,62,80,82,83,62,83,84,84,58],"Hip thrust":[65,68,70,58,74,76,78,62,78,80,80,62,80,80,80,58],"Weighted pull-up":[62,65,68,55,74,76,78,60,80,82,83,60,83,84,84,55]},"T":[["30 m sprint","s","lower"],["5-10-5 pro agility","s","lower"],["L-drill","s","lower"],["Standing long jump","cm","higher"],["Back squat 3RM","kg","higher"],["Bench press 3RM","kg","higher"],["Weighted pull-up 3RM","kg added","higher"],["5 km time trial","mm:ss","lower"],["Hyrox 1 km goal pace","mm:ss","lower"],["Ski erg 1000 m","mm:ss","lower"],["Half-Hyrox simulation","mm:ss","lower"]],"F":{"load":[["kg","Weight","decimal"],["reps","Reps","decimal"]],"bw":[["reps","Reps","decimal"],["kg","+ / − kg","decimal"]],"carry":[["kg","Per hand","decimal"]],"erg_t":[["m","Distance","decimal"]],"erg_d":[["mm:ss","Time","text"]],"run_d":[["mm:ss","Time","text"]],"run_t":[["m","Distance","decimal"]],"machine":[["level","Level / %","decimal"],["mm:ss","Time","text"]],"drill_t":[["s","Seconds","decimal"]],"drill_r":[["reps","Reps","decimal"]],"hold":[["s","Seconds","decimal"]]},"R":{"load":180,"bw":120,"carry":120,"erg_t":90,"erg_d":120,"run_d":120,"run_t":90,"machine":90,"drill_t":90,"drill_r":60,"hold":60},"G":{"Back squat":["Bar on your upper traps, feet shoulder width, toes slightly out. Take a breath into your belly and hold it.","Break at hips and knees together and sit down between your feet. Keep the bar stacked over mid-foot the whole way.","Descend until your hip crease passes below your knee, then drive up through mid-foot and stand tall.","Knees caving in on the way up. Think about screwing your feet into the floor.","barbell back squat form"],"Barbell deadlift":["Bar over mid-foot, shins almost touching it. Push your hips back and grip the bar.","Pull the slack out until the bar clicks against the plates, then push the floor away rather than yanking up.","Stand tall with the bar at your hips. Don't lean back at the top.","Hips shooting up first, which turns it into a stiff-leg. Chest and hips rise together.","conventional deadlift technique"],"Romanian deadlift":["Start standing with the bar at your hips, knees soft. This is a hinge, not a squat.","Push your hips backwards and let the bar drag down your thighs, keeping the knee angle unchanged.","Stop when you feel a strong hamstring stretch, usually just below the knee, then stand by squeezing your glutes.","Bending the knees more as you descend. That kills the stretch and the whole point of the lift.","romanian deadlift form"],"Bulgarian split squat":["Rear foot up on a bench, front foot far enough forward that your front shin stays near vertical.","Drop straight down, not forward. Your torso stays tall.","Stop when your back knee is just off the floor, then drive up through the front heel.","Standing too close to the bench, which pushes every kilo into the front knee.","bulgarian split squat setup"],"Split squat":["Same as the Bulgarian but with the rear foot on the floor. Feet about hip width apart, not on a tightrope.","Drop straight down between your feet.","Back knee to just off the floor, then drive up through the front heel.","Easier to load and balance than the Bulgarian, so this is the version to use when you're tired.","split squat form"],"Walking or reverse lunge":["Stand tall with dumbbells hanging at your sides.","Step out (or backwards for a reverse lunge) and drop the back knee toward the floor.","Drive back up through the front heel. Reverse lunges are gentler on the knees and need less floor space.","Letting the torso pitch forward. The dumbbells hang; they don't pull you over.","walking lunge dumbbell form"],"Hip thrust":["Shoulder blades on a bench, bar across your hips with a pad, feet flat and about knee width.","Drive through your heels and lift the hips.","Stop when your torso and thighs form a straight line, squeeze hard for a beat, then lower under control.","Arching the lower back to go higher. Tuck your ribs down and finish with the glutes.","barbell hip thrust form"],"Step-up":["Box at roughly knee height. Place your whole foot on the box, not just the toes.","Drive through the top heel without pushing off the trailing leg to help.","Stand tall on the box, then lower yourself slowly back down.","The slow lowering is most of the value. Dropping off the box wastes the rep.","dumbbell step up exercise"],"Nordic curl or slider hamstring curl":["Nordic: kneel with your ankles anchored. Slider: lie on your back with heels on sliders and bridge up.","Nordic: lower your torso forward as slowly as you can. Slider: slide your heels out without letting your hips drop.","Nordic: catch yourself with your hands and push back up. Slider: drag the heels back in.","Rushing the lowering. Three slow seconds down beats any number of fast reps.","nordic hamstring curl beginner"],"Standing calf raise":["Balls of your feet on a step, heels hanging off the back.","Let the heels drop well below the step for a full stretch, pause one second.","Rise all the way up onto the big toe and pause one second at the top.","Bouncing through the reps. Calves respond to time under tension, not momentum.","standing calf raise form"],"Speed squat":["A light squat, 40–60% of your best. Same set-up as a back squat.","Lower under control, then reverse and drive up as fast as you physically can.","Stand tall, reset, repeat. The weight is a vehicle for speed, nothing else.","If the bar isn't visibly accelerating, take weight off rather than adding reps.","speed squat compensatory acceleration"],"Front squat":["Bar across the front of your shoulders, elbows high, torso upright.","Squat straight down with the torso near vertical. The bar falls forward if you tip.","Drive up through mid-foot, elbows staying high throughout.","Elbows dropping. That's the fault that dumps the bar, and it's why this loads quads more and lower back less.","front squat form elbows"],"Kettlebell swing":["Hinge at the hips, bell about a foot in front of you, shins near vertical.","Hike the bell back between your legs like a rugby pass, then snap your hips forward hard.","The bell floats to chest height on its own and you let it fall back into the next hinge.","Squatting the bell up instead of hinging. Your arms are rope, they don't lift anything.","kettlebell swing hardstyle form"],"DB snatch":["One dumbbell between your feet. Hinge and grip it, back flat.","Drive the floor away and pull the bell straight up close to your body.","Punch your hand through at the top so it finishes locked out overhead. Alternate arms each rep.","Letting the bell swing away from you, which means the hips finished too early.","dumbbell snatch technique"],"Hang high pull":["Bar or dumbbells at mid-thigh, arms long, shoulders over the bar.","Dip slightly, then explode upward through the hips.","Pull the weight to chest height with the elbows finishing above the hands.","Pulling with the arms. The hips launch it; the arms only catch what the hips threw.","hang high pull barbell"],"Pogo hops":["Stand tall on the balls of your feet, knees almost straight, ankles stiff.","Bounce in place with tiny, fast hops. You're barely leaving the floor.","Ten fast, quiet contacts, then rest. Contact should feel like a bounce, not a landing.","Bending the knees and jumping high. Height ruins it; this is tendon stiffness work.","pogo hops plyometric drill"],"Bench press":["Shoulder blades pulled back and down into the bench, feet planted, slight arch.","Lower the bar to your lower chest with elbows about 45° from your body.","Press back up and slightly toward your face, not straight over the shoulders.","Flaring the elbows straight out to the sides. That's where shoulders get hurt.","bench press form elbow tuck"],"Incline DB press":["Bench at 30°. Any steeper and it becomes a shoulder press.","Lower the dumbbells until you feel a stretch across the chest, letting your shoulders find their own path.","Press up but stop just short of lockout to keep tension on the chest.","Setting the bench too steep. 30° is the number.","incline dumbbell press 30 degrees"],"Explosive push-up":["Standard push-up position, hands under shoulders, body in one line.","Lower your chest to the floor, then drive up hard enough that your hands leave the ground.","Land with soft, bent elbows and go straight into the next rep.","Speed is the point. End the set the moment you stop leaving the ground.","clapping push up progression"],"Pull-up or lat pulldown":["Start from a dead hang with shoulders active rather than slumped into your ears.","Pull your elbows down toward your ribs, thinking about driving them into your back pockets.","Chin over the bar, then lower all the way back to a full hang.","Shortening either end of the range. Half hangs and half pulls are the usual cheat.","pull up form scapular"],"Weighted pull-up":["Same as above with a belt or a dumbbell between your feet.","Identical movement. The load doesn't change the range.","Chin over the bar, full stretch at the bottom, no kipping.","Add weight only once you can do ten clean bodyweight reps. If the bottom gets shallower, drop the load.","weighted pull up progression"],"Barbell row":["Hinge to roughly 45°, back flat, bar hanging at arm's length.","Pull the bar to your lower ribs while the angle of your back stays completely unchanged.","Pause at the top, then lower under control.","Using your hips to heave the bar. If your torso is bobbing, it's too heavy.","barbell row form pendlay"],"Chest-supported row or DB row":["Chest on an incline bench, which removes your lower back from the exercise entirely.","Pull with the elbows going back past your ribs, not out to the sides.","Squeeze the shoulder blades at the top, then lower all the way to a stretch.","This is the row to use in a week where you also squat and deadlift heavy.","chest supported dumbbell row"],"Push press":["Bar on your front shoulders, feet hip width, ribs down.","Dip a few inches by bending the knees straight down, then reverse hard.","Use that leg drive to launch the bar overhead and finish with a full lockout.","Turning the dip into a squat. It's short and vertical; if your hips travel back you've lost the drive.","push press dip drive technique"],"DB shoulder press":["Seated or standing, dumbbells at shoulder height, glutes tight.","Press straight up without leaning back, keeping your ribs pulled down.","Lock out overhead, then lower under control to shoulder height.","Leaning back to finish a rep. That means the weight is too heavy, or you needed a push press.","dumbbell shoulder press form"],"Landmine press":["One end of a barbell in a corner or landmine sleeve, other end at your shoulder.","Press up and forward along the bar's natural arc rather than fighting it.","Finish with the arm extended at an angle, not straight overhead.","The angle is friendly to shoulders that don't love strict overhead work. Use it when they're grumpy.","landmine press form"],"Face pull":["Rope at eye height on a cable, arms extended, light weight.","Pull toward your face while spreading your hands apart.","Finish with the knuckles rotated up and the hands wider apart than they started.","Turning it into a heavy row to the chest. This is postural insurance; go light and high rep.","face pull form cable"],"Band pull-apart and scap pull-up":["Warm-up staples. Pull-apart: band at chest height, arms straight. Scap pull-up: hang from the bar.","Pull-apart: pull the band apart until it touches your chest. Scap: shrug your shoulders down without bending the elbows.","Control the return on both. Neither is ever loaded heavy enough to be a working set.","Both wake up the muscles that hold your shoulder blades in place before you press or pull.","band pull apart scapular pull up"],"Explosive band pulldown":["Band anchored overhead, arms straight, standing tall.","Pull it down to your thighs as fast as you possibly can.","Control the return, reset, repeat.","This trains the pull-up pattern at speed instead of load. Stop the set when it slows.","explosive band lat pulldown"],"Hand-over-hand rope pull":["Rope attachment on a heavy cable stack. Sit or kneel far enough back that the weight lifts.","Pull the rope in hand over hand while staying braced. Your torso doesn't rock.","Steady rhythm all the way in, then reset.","The closest thing in a commercial gym to the Hyrox sled pull, grip fatigue included.","hyrox sled pull cable substitute"],"Ski erg or rower intervals":["Ski: handles high, standing tall. Row: shins vertical, arms long, shoulders in front of the hips.","Ski: hinge at the hips and drive the handles down past your hips using your whole body. Row: legs, then back, then arms.","Ski: stand back up and reach tall. Row: arms, then back, then legs on the recovery.","Pulling with the arms. Watch the split, not the clock — every interval should land within a couple of seconds of the others.","ski erg technique concept2"],"Farmer's carry":["Heavy dumbbells at your sides, shoulders pulled back, ribs down.","Walk with normal-length steps, torso stacked. No leaning.","Set them down before your form breaks, not after. Walk a 10 m shuttle if space is short.","Grip usually fails first, which is exactly what you're training.","farmers carry form"],"Max-incline treadmill walk":["Treadmill at its steepest incline, walking pace, hands completely off the rails.","Lean into the hill and take deliberate full steps rather than short shuffles.","Hold the interval. Quads and calves should be burning by the end.","Holding the rails. If it doesn't burn, either the incline is too low or you're hanging on.","incline treadmill walk sled substitute"],"Stair climber":["Set the resistance high enough that you're stepping deliberately rather than scampering.","Full steps, upright posture, hands free.","Hold the effort for the prescribed time.","Leaning on the rails is the entire cheat. If you can hold a conversation, raise the level.","stairmaster form no rails"],"Leg press, continuous tension":["Moderate weight, feet high on the platform.","Lower until your knees come toward your chest, then press back without ever locking out.","Keep the plate moving for the whole set: 20–30 slow reps, or simply work for 45 seconds.","Locking out to rest. This is the loaded half of the sled push, so tension never comes off.","leg press continuous tension set"],"DB or KB thruster":["Bells at your shoulders, feet shoulder width.","Squat to full depth, then stand and drive the bells overhead in one continuous movement.","Lock out overhead, then let them fall back to the shoulders into the next squat.","Pausing at the top of the squat. The squat and press must blend into a single motion.","dumbbell thruster form"],"DB front-rack walking lunge":["Bells held at the shoulders, not hanging at your sides.","Step out and drop the back knee toward the floor, torso staying upright.","Drive up through the front heel into the next step. Reverse lunges in place if space is short.","The front-rack load is what forces the upright torso. That's what makes it feel like the Hyrox sandbag.","front rack walking lunge dumbbell"],"Step-back burpee":["Stand tall. Hands down to the floor.","Step one foot back then the other, lower your chest to the floor, then step back in.","Stand tall and reach overhead. No jump at either end.","Slower per rep than a jumping burpee, so keep the pace honest and don't rest standing up.","step back burpee no jump"],"Dead bug":["On your back, arms straight up, knees stacked over hips, lower back pressed into the floor.","Lower the opposite arm and leg toward the floor slowly.","Return to the start and switch sides. Slow and boring is correct.","If your lower back arches off the floor, you've gone too far. Shorten the reach.","dead bug exercise form"],"Side plank":["Elbow directly under your shoulder, body in one straight line, hips lifted.","Hold. Breathe normally rather than bracing your way through it.","End the set when the hips start to drop, not when the clock says so.","Trains the muscles that stop your torso folding sideways when you cut or carry.","side plank form"],"Pallof press":["Stand side-on to a cable at chest height, handle held at your sternum, feet shoulder width.","Press the handle straight out and resist the cable's pull to rotate you.","Return to the sternum under control. Nothing moves except your arms.","Letting the shoulders or hips turn toward the cable. The whole exercise is refusing to rotate.","pallof press anti rotation"],"Hanging knee raise":["Hang from the bar, shoulders active, no swing.","Raise your knees toward your chest by curling your pelvis up, not just lifting the thighs.","Control the way down. Fully still before the next rep.","Swinging. Momentum makes this a hip flexor exercise and nothing else.","hanging knee raise posterior pelvic tilt"],"Build-ups":["Start from a jog on the track.","Gradually accelerate over 30–40 m until you reach about 80%.","Ease down, walk back, repeat. Three of these before any fast work.","Attacking the start. A build-up is the bridge between warming up and sprinting; it should feel smooth.","sprint build ups warm up"],"A-march and A-skip":["Stand tall, ankle pulled up toward your shin.","March or skip forward, driving one knee to hip height while the other foot stays under you.","Strike the ground underneath your hip rather than out in front. Rhythm over height.","Reaching the foot out in front, which is braking. That's the exact fault this drill fixes.","a skip sprint drill technique"],"Wall drive":["Hands on a wall, body in one straight line at about 45°, up on the toes.","Drive one knee up to hip height and hold the position.","Switch legs. Then progress to fast alternating switches.","Piking the hips back. The straight line from ankle to head is the position you're rehearsing.","wall drill acceleration sprint"],"Falling start":["Stand tall, feet together, arms relaxed.","Lean forward from the ankles until you're about to fall over.","Run out of it. 20 m is plenty.","Gravity sets your lean angle for you, so it's impossible to pop upright too early. That's why it works.","falling start sprint drill"],"Acceleration sprint":["From a staggered or three-point stance.","Push the ground back behind you with long, low first steps.","Rise gradually over 20–30 m. Walk back to the start for full recovery.","Standing up in the first two strides. The body angle should unfold over the whole run.","acceleration sprint mechanics first steps"],"Flying 20":["Mark a 20 m build-up zone and a 20 m fly zone.","Build up smoothly over the first 20 m without attacking it.","Hit your genuine top speed through the second 20 m. Three full minutes of rest between reps.","This is the only drill in the plan that trains true max velocity. A tired fly is just a fast jog.","flying 20 sprint max velocity"],"Standing long jump":["Feet together behind a line.","Swing your arms back, load the hips, then throw yourself forward.","Land on both feet with bent knees. Measure it and track your best every few weeks.","A clean number for horizontal power, and a good check on whether Block 3 worked.","standing broad jump technique"],"Dot drill":["Tape five dots like the five-face of a die inside one square metre.","Hop the patterns: up-and-back, side to side, scissor, hourglass.","Fifteen to twenty seconds per pattern, then rest forty. Feet quick and quiet.","Watching your feet. Eyes up, and stop the moment the rhythm breaks.","dot drill agility five dots"],"Wall drive quick feet":["Hands on the wall, body at 45°, up on the toes.","Alternate knee drives at maximum frequency.","Ten seconds, then rest. Stride frequency without needing runway.","Letting the hips sag or pike. Hold the straight line while the feet move fast.","wall drill quick feet sprint"],"Hip turn":["Athletic stance facing forward, knees soft, weight on the balls of your feet.","On a cue, snap your hips 90° open.","Take one hard drive step in the new direction, then reset.","Stepping first and turning second. The hips open first and the feet follow.","hip turn drill football defensive back"],"Foot fire into a turn":["Quick feet on the spot, staying low.","React to a called or beeped direction.","Snap to face it and take one drive step. Reset and repeat.","Knowing which way you're going. Use a random beep app if you're training alone.","foot fire reaction drill agility"],"Band-resisted shuffle":["Band anchored at hip height, looped around your waist, standing side-on.","Shuffle against the band. You barely travel because the band pulls you back.","Fifteen seconds each direction, staying low throughout.","Standing up as you tire. The resistance replaces the lane you don't have.","band resisted lateral shuffle"],"Skater step and stick":["Stand on one leg, athletic position.","Push off laterally and land on the outside leg about a metre away.","Hold for two full seconds without wobbling before the next one.","Going high instead of long. If you wobble on landing, shorten the bound.","skater bound stick landing"],"Step-down landing":["Stand on a bench or low box on one leg.","Step off — don't jump — and land on one leg.","Stick the landing and hold. Silent landings only.","Noise on landing means you absorbed nothing. This is pure deceleration training.","single leg landing drill deceleration"],"Reactive wall catch":["Stand a couple of metres from a wall with a tennis ball.","Bounce it off the wall at a random height and angle.","React, move, and catch it after one bounce.","Throwing it the same way every time. The randomness is the entire point.","tennis ball wall reaction drill"],"Split-stance switches":["Athletic stance, one foot forward, staying low.","Scissor your feet fore-and-aft as fast as possible.","Fifteen seconds, feet barely leaving the floor.","Low amplitude, so a low ceiling and a hard floor are both fine.","split squat jumps quick feet"],"5-10-5 pro agility":["Three cones five yards apart in a line. Straddle the middle one in a three-point stance.","Sprint five yards to one side and touch the line with your hand, then ten yards across and touch again.","Sprint five yards back through the middle. Time it — under 5.0 s is solid; Combine skill positions run about 4.0 s.","Standing tall in the turns. Get low; height costs time.","5-10-5 pro agility shuttle technique"],"L-drill":["Three cones in an L, five yards on each arm. Start at the corner cone.","Sprint to cone two and touch, back to the start and touch, then out again.","Cut tight around cone two, loop cone three, weave back around two and sprint home.","Wide turns. This drill rewards tight cornering and hip flexibility, not straight-line speed.","3 cone drill l drill technique"],"W-drill":["Five cones in a zig-zag, about five yards apart.","Sprint forward on the diagonals.","Backpedal on the returns, continuously, without stopping between legs.","The most football-shaped conditioning there is. The transitions are the work.","w drill football agility"],"Backpedal into break":["Athletic stance, weight on the balls of your feet.","Backpedal five steps, staying low.","Plant and drive forward or diagonally on a cue.","Drifting into the turn. The plant foot decides everything.","backpedal break drill defensive back"],"Box drill":["Four cones in a five-metre square. Start at one corner.","Sprint up the first side, shuffle across the top, backpedal down the far side.","Shuffle back to the start. One lap, four movement patterns, four direction changes.","Turning your shoulders. Face the same direction the whole lap.","box drill agility cones"]}, \" font-size=\"12\" fill=\"var(--ink)\">3 · Backpedal down the far side</text>\n<text x=\"360\" y=\"158\" font-family=\"var(--body)\" font-size=\"12\" fill=\"var(--ink)\">4 · Shuffle back to the start</text>\n<line x1=\"360\" y1=\"176\" x2=\"680\" y2=\"176\" stroke=\"var(--line)\"/>\n<text x=\"360\" y=\"196\" font-family=\"var(--body)\" font-size=\"11.5\" fill=\"var(--soft)\">Face the same direction the whole lap — never</text>\n<text x=\"360\" y=\"213\" font-family=\"var(--body)\" font-size=\"11.5\" fill=\"var(--soft)\">turn your shoulders. The corners are the training,</text>\n<text x=\"360\" y=\"230\" font-family=\"var(--body)\" font-size=\"11.5\" fill=\"var(--soft)\">not the sides.</text>\n</svg>","Flying 20":"<svg viewBox=\"0 0 680 226\"><defs><marker id=\"ah2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M2 2L8 5L2 8\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></marker></defs>\n<text x=\"0\" y=\"14\" font-family=\"var(--mono)\" font-size=\"9.5\" letter-spacing=\"1.2\" fill=\"var(--ox)\">FLYING 20 — THE ONLY TRUE MAX-VELOCITY DRILL IN THE PLAN</text>\n<path d=\"M40 108 Q140 108 240 72 T440 56\" fill=\"none\" stroke=\"var(--turf)\" stroke-width=\"2\"/>\n<line x1=\"440\" y1=\"56\" x2=\"620\" y2=\"56\" stroke=\"var(--ox)\" stroke-width=\"3\"/>\n<text x=\"240\" y=\"46\" text-anchor=\"middle\" font-family=\"var(--body)\" font-size=\"11.5\" fill=\"var(--soft)\">speed rising</text>\n<text x=\"530\" y=\"42\" text-anchor=\"middle\" font-family=\"var(--mono)\" font-size=\"9.5\" letter-spacing=\"1.2\" fill=\"var(--ox)\">TOP SPEED, HELD</text>\n<line x1=\"40\" y1=\"140\" x2=\"620\" y2=\"140\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/>\n<line x1=\"40\" y1=\"132\" x2=\"40\" y2=\"148\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/>\n<line x1=\"440\" y1=\"132\" x2=\"440\" y2=\"148\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/>\n<line x1=\"620\" y1=\"132\" x2=\"620\" y2=\ var S={log:{},tests:{},wt:{},rm:{},extra:{},theme:"",sub:{},exnote:{},ready:{},bar:20,plates:"25,20,15,10,5,2.5,1.25"};
var el=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
 return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var K=function(w,d){return "w"+w+"d"+d};
var num=function(v){var f=parseFloat(v);return isNaN(f)?null:f};

/* ---------- storage ---------- */
function load(){
 try{
  var r=localStorage.getItem(KEY);
  if(!r){var o=localStorage.getItem(OLD);
   if(o){var q=JSON.parse(o);/* migrate v1: single value -> first field */
    if(q.log)for(var k in q.log){var e=q.log[k];for(var nm in (e.sets||{}))
      e.sets[nm]=e.sets[nm].map(function(v){return v?[v]:[]});}
    ["log","tests","wt","rm"].forEach(function(x){if(q[x])S[x]=q[x]});return}}
  if(r){var p=JSON.parse(r);["log","tests","wt","rm","extra","sub","exnote","ready"].forEach(function(x){if(p&&p[x])S[x]=p[x]});
   ["theme","bar","plates"].forEach(function(x){if(p&&p[x]!==undefined&&p[x]!=="")S[x]=p[x]})}
 }catch(e){}}
var tmr=null,flash=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));say("Saved")}
 catch(e){say("Could not save — storage may be full or Private Browsing is on",1)}}
function queue(){clearTimeout(tmr);say("Saving…");tmr=setTimeout(save,450)}
function say(m,bad){if(flash){flash.textContent=m;flash.style.color=bad?"var(--ox)":""}}


/* ---------- figure renderer ---------- */
var SIL=HB.SIL||{},CONE=HB.CONE||{};
function _s(a,b,wid,c,op){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+
 '" stroke="'+c+'" stroke-width="'+wid+'" stroke-linecap="round" opacity="'+op+'"/>'}
function _eq(kind,pt){var x=pt[0],y=pt[1],A="var(--ox)";
 if(kind==="bar")return '<line x1="'+(x-32)+'" y1="'+y+'" x2="'+(x+32)+'" y2="'+y+
  '" stroke="'+A+'" stroke-width="5" stroke-linecap="round"/><circle cx="'+(x-32)+'" cy="'+y+
  '" r="7" fill="'+A+'"/><circle cx="'+(x+32)+'" cy="'+y+'" r="7" fill="'+A+'"/>';
 if(kind==="db")return '<rect x="'+(x-16)+'" y="'+(y-11)+'" width="10" height="22" rx="3" fill="'+A+
  '"/><rect x="'+(x+6)+'" y="'+(y-11)+'" width="10" height="22" rx="3" fill="'+A+'"/>';
 if(kind==="kb")return '<circle cx="'+x+'" cy="'+(y+9)+'" r="11" fill="'+A+'"/><path d="M'+(x-7)+' '+(y+1)+
  ' Q'+x+' '+(y-12)+' '+(x+7)+' '+(y+1)+'" fill="none" stroke="'+A+'" stroke-width="3.4"/>';
 if(kind==="plate")return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="none" stroke="'+A+'" stroke-width="3.4"/>';
 return ""}
function _side(sd,dx){
 var j=sd.j,I="var(--ink)",SF="rgba(22,33,28,.28)",o=[];
 if(sd.p)o.push(sd.p);
 if(j.k2){o.push(_s(j.p,j.k2,12,SF,1));o.push(_s(j.k2,j.a2,11,SF,1));
  if(j.t2)o.push(_s(j.a2,j.t2,8,SF,1))}
 if(j.e2){o.push(_s(j.n,j.e2,8,SF,1));o.push(_s(j.e2,j.w2,7,SF,1))}
 o.push(_s(j.n,j.p,23,I,1));o.push(_s(j.p,j.k,14,I,1));o.push(_s(j.k,j.a,12,I,1));
 o.push(_s(j.a,j.t,8,I,1));o.push(_s(j.n,j.e,10,I,1));o.push(_s(j.e,j.w,8,I,1));
 o.push('<circle cx="'+j.h[0]+'" cy="'+j.h[1]+'" r="11" fill="'+I+'"/>');
 if(sd.e)o.push(_eq(sd.e,j[sd.ea||"w"]));
 return '<g transform="translate('+dx+',0)">'+o.join("")+'</g>'}
function figFor(name){
 if(CONE[name])return CONE[name];
 var f=SIL[name];if(!f)return "";
 var L='<line x1="2" y1="146" x2="148" y2="146" stroke="var(--line)" stroke-width="2"/>';
 var R='<line x1="192" y1="146" x2="338" y2="146" stroke="var(--line)" stroke-width="2"/>';
 var ar='<line x1="160" y1="84" x2="178" y2="84" stroke="rgba(22,33,28,.6)" stroke-width="1.8"/>'+
  '<path d="M172 79 L178 84 L172 89" fill="none" stroke="rgba(22,33,28,.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
 function bdg(dx,n){return '<circle cx="'+(dx+12)+'" cy="16" r="10" fill="none" stroke="var(--ox)" stroke-width="1.6"/>'+
  '<text x="'+(dx+12)+'" y="20" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ox)">'+n+'</text>'}
 return '<svg viewBox="0 0 340 172" class="figsvg">'+L+R+_side(f[0],0)+ar+_side(f[1],190)+
   bdg(0,1)+bdg(190,3)+'</svg>'}


/* ---------- themes ---------- */
var THEMES=[["","Auto"],["track","Track"],["carbon","Carbon"],["press","Press"],["court","Court"]];
function sysDark(){try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches}
 catch(e){return false}}
function hostDark(){
 /* some in-app browsers paint a dark canvas regardless of our CSS */
 try{
  var b=getComputedStyle(document.body).backgroundColor||"";
  var m=b.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(!m)return false;
  var lum=(0.2126*m[1]+0.7152*m[2]+0.0722*m[3])/255;
  return lum<0.35;
 }catch(e){return false}}
function applyTheme(){
 var r=document.documentElement;
 if(S.theme)r.setAttribute("data-theme",S.theme);
 else r.removeAttribute("data-theme");
 /* some in-app browsers ignore the media query but honour an explicit scheme */
 r.style.colorScheme=(S.theme==="carbon"||(!S.theme&&sysDark()))?"dark":"light";
 var bg={track:"#DDE1DC",carbon:"#14171A",press:"#F3EFE6",court:"#E3E8EC"}[S.theme]||
   (sysDark()?"#14171A":"#DDE1DC");
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute("content",bg)}
try{if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)")
 .addEventListener("change",function(){if(!S.theme)applyTheme()})}catch(e){}

/* ---------- personal records ---------- */
var DIR={load:["hi",0],carry:["hi",0],bw:["hi",0],erg_t:["hi",0],run_t:["hi",0],
 erg_d:["lo",0],run_d:["lo",0],drill_t:["lo",0],hold:["hi",0],drill_r:["hi",0]};
function val(v){
 if(v==null||v==="")return null;
 var s2=String(v).trim();
 if(s2.indexOf(":")>0){var p=s2.split(":");var m=parseFloat(p[0]),sc=parseFloat(p[1]);
  return (isNaN(m)||isNaN(sc))?null:m*60+sc}
 var f=parseFloat(s2);return isNaN(f)?null:f}
function bestBefore(w,d,name,kind){
 var dir=DIR[kind];if(!dir)return null;
 var best=null;
 for(var pw=1;pw<=16;pw++)for(var pd=1;pd<=4;pd++){
  if(pw>w||(pw===w&&pd>=d))continue;
  var e=S.log[K(pw,pd)];if(!e||!e.sets[name])continue;
  e.sets[name].forEach(function(a){if(!a)return;var v=val(a[dir[1]]);if(v===null)return;
   if(best===null)best=v;else best=(dir[0]==="hi")?Math.max(best,v):Math.min(best,v)})}
 return best}
function isPR(w,d,name,kind,raw){
 var dir=DIR[kind];if(!dir)return false;
 var v=val(raw&&raw[dir[1]]);if(v===null)return false;
 var b=bestBefore(w,d,name,kind);
 if(b===null)return false;
 return dir[0]==="hi"?v>b:v<b}

/* ---------- 1RM inferred from what you actually lifted ---------- */
function epley(kg,reps){return kg*(1+reps/30)}
function inferRM(lift){
 var best=null,at=null;
 for(var w=1;w<=16;w++)for(var d=1;d<=4;d++){
  var e=S.log[K(w,d)];if(!e)continue;
  Object.keys(e.sets).forEach(function(nm){
   if(nm!==lift&&nm.indexOf(lift)!==0)return;
   e.sets[nm].forEach(function(a){if(!a)return;
    var kg=val(a[0]),rp=val(a[1]);
    if(kg===null||rp===null||rp<1||rp>12||kg<=0)return;
    var est=epley(kg,rp);
    if(best===null||est>best){best=est;at={w:w,kg:kg,r:rp}}})})}
 if(best===null)return null;
 return{est:Math.round(best/2.5)*2.5,at:at}}
function rmNudges(){
 var out=[];
 Object.keys(L).forEach(function(lift){
  var inf=inferRM(lift);if(!inf)return;
  var cur=num(S.rm[lift]);
  if(!cur||inf.est>=cur+2.5)out.push({lift:lift,est:inf.est,cur:cur,at:inf.at})});
 return out}

/* ---------- session clock ---------- */
var clockIv=null;
function fmt(sec){var m=Math.floor(sec/60),s2=sec%60;return m+":"+(s2<10?"0":"")+s2}
function drawClock(r){
 var c=el("clk");if(!c)return;
 var sec=r.el||0;
 if(r.t0&&!r.el)sec=Math.max(0,Math.round((Date.now()-r.t0)/1000));
 c.className="clock"+(sec>90*60?" over":"");
 c.innerHTML='<b>'+fmt(sec)+'</b><span>'+(r.t0&&!r.el?"session running":r.el?"finished":"not started")+
  '</span><button class="mini" id="clkb">'+(r.t0&&!r.el?"Stop":(r.el?"Restart":"Start"))+'</button>';
 el("clkb").onclick=function(){
  if(r.t0&&!r.el){r.el=Math.max(0,Math.round((Date.now()-r.t0)/1000))}
  else{r.t0=Date.now();r.el=0}
  save();drawClock(r)}}


/* ---------- substitutions ---------- */
var CO=HB.CO||[],KINDS=HB.KIND||[];
function coefJS(name){
 for(var i=0;i<CO.length;i++){if(name===CO[i][0]||name.indexOf(CO[i][0])===0)return CO[i][1]}
 return null}
function sub(it){
 var s2=S.sub[it.n];if(!s2)return it;
 var o={};for(var k in it)o[k]=it[k];
 o.n=s2.n; o.orig=it.n;
 if(s2.k)o.k=s2.k;
 var c=coefJS(s2.n); if(c)o.c=c; else delete o.c;
 return o}

/* ---------- plates and ramp ---------- */
function plateList(){return String(S.plates||"").split(",").map(function(x){return parseFloat(x)})
 .filter(function(x){return x>0}).sort(function(a,b){return b-a})}
function plates(total){
 var bar=parseFloat(S.bar)||20;
 if(total<bar)return{ok:false,msg:"lighter than the bar ("+bar+" kg)"};
 var side=(total-bar)/2,out=[],ps=plateList(),left=side;
 ps.forEach(function(p){var n=Math.floor((left+1e-6)/p);if(n>0){out.push(n>1?n+"×"+p:String(p));left-=n*p}});
 return{ok:true,side:out,rem:Math.round(left*100)/100,bar:bar}}
function ramp(top){
 var pc=[0.4,0.55,0.7,0.85],rp=[5,5,3,2],out=[];
 pc.forEach(function(p,i){var w=Math.round(top*p/2.5)*2.5;
  if(w>=(parseFloat(S.bar)||20))out.push({w:w,r:rp[i]})});
 return out}
function loadHelper(top,per){
 var h='<div class="lh">';
 if(per)h+='<p class="lhn">Per hand — the plate maths below assumes a barbell, so ignore it for dumbbells.</p>';
 h+='<p class="lhh">Warm-up ramp</p>';
 ramp(top).forEach(function(r2){
  var p=plates(r2.w);
  h+='<div class="lhr"><b>'+r2.w+' kg</b><span>× '+r2.r+'</span><i>'+
     (p.ok?p.side.join(" + ")+" a side":p.msg)+'</i></div>'});
 var p2=plates(top);
 h+='<p class="lhh">Working weight</p><div class="lhr top"><b>'+top+' kg</b><span></span><i>'+
    (p2.ok?p2.side.join(" + ")+" a side"+(p2.rem?" (+"+p2.rem+" short)":""):p2.msg)+'</i></div>';
 h+='<p class="lhn">Bar '+(parseFloat(S.bar)||20)+' kg · plates '+esc(S.plates)+' — change these in Data.</p></div>';
 return h}

/* ---------- tonnage ---------- */
function tonnage(w){
 var t=0;
 for(var d=1;d<=4;d++){var e=S.log[K(w,d)];if(!e)continue;
  Object.keys(e.sets).forEach(function(nm){
   e.sets[nm].forEach(function(a){if(!a)return;
    var kg=val(a[0]),rp=val(a[1]);
    if(kg!==null&&rp!==null&&kg>0&&rp>0)t+=kg*rp})})}
 return Math.round(t)}

/* ---------- plan helpers ---------- */
function blk(w){return P[Math.min(3,Math.floor((w-1)/4))]}
function rec(w,d){var k=K(w,d);if(!S.log[k])S.log[k]={sets:{},note:"",date:"",done:false};
 if(!S.extra[k])S.extra[k]=[];return S.log[k]}
function tgtFor(it,w){if(!it.c)return null;var one=num(S.rm[it.c[0]]);if(!one||one<=0)return null;
 var v=Math.round(one*(L[it.c[0]][w-1]/100)*it.c[1]/2.5)*2.5;return v>0?{v:v,per:it.c[2]}:null}
function fields(k){return FL[k]||FL.drill_r}

/* full history: every prior week this movement was logged, newest first */
function history(w,name){
 var out=[];
 for(var pw=w-1;pw>=1;pw--)for(var pd=1;pd<=4;pd++){
  var e=S.log[K(pw,pd)];if(!e||!e.sets[name])continue;
  var rows=e.sets[name].filter(function(a){return a&&a.length&&a.some(function(v){return v})});
  if(rows.length)out.push({w:pw,d:pd,rows:e.sets[name]});}
 return out}

/* progression: two consecutive logged sessions where every set met the target reps */
function progressCue(it,w){
 if(it.k!=="load"||!it.r)return null;
 var h=history(w,it.n);if(h.length<2)return null;
 function clean(rows){
  var ok=0,tot=0,wt=null;
  rows.forEach(function(a){if(!a||!a.length)return;
   var kg=num(a[0]),rp=num(a[1]);if(kg===null)return;tot++;
   if(rp!==null&&rp>=it.r)ok++;if(wt===null||kg<wt)wt=kg});
  return{full:tot>0&&ok===tot,wt:wt,n:tot}}
 var a=clean(h[0].rows),b=clean(h[1].rows);
 if(!a.full||!b.full)return null;
 if(a.wt===null||b.wt===null||a.wt<b.wt)return null;
 var par=it.c?it.c[0]:"";
 var step=it.c&&it.c[2]?2:(par==="Back squat"||par==="Barbell deadlift"||par==="Hip thrust"?5:2.5);
 return{from:a.wt,to:a.wt+step,per:it.c&&it.c[2]}}

/* ---------- rest timer ---------- */
var restEnd=0,restIv=null,ac=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
 o.frequency.value=880;g.gain.setValueAtTime(.001,ac.currentTime);
 g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.02);
 g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);
 o.start();o.stop(ac.currentTime+.75)}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([220,120,220])}catch(e){}}
function startRest(sec){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}
 restEnd=Date.now()+sec*1000;drawRest();
 if(restIv)clearInterval(restIv);restIv=setInterval(drawRest,250)}
function stopRest(){restEnd=0;if(restIv)clearInterval(restIv);restIv=null;drawRest()}
function drawRest(){
 var bar=el("rest");if(!bar)return;
 if(!restEnd){bar.className="rest";bar.innerHTML="";return}
 var left=Math.max(0,Math.round((restEnd-Date.now())/1000));
 if(left===0&&restIv){clearInterval(restIv);restIv=null;beep();
  bar.className="rest on go";bar.innerHTML='<b>GO</b><span>rest done</span><button id="rx">Dismiss</button>';
  el("rx").onclick=stopRest;setTimeout(function(){if(restEnd&&Date.now()>restEnd+15000)stopRest()},16000);return}
 var m=Math.floor(left/60),s2=left%60;
 bar.className="rest on";
 bar.innerHTML='<b>'+m+":"+(s2<10?"0":"")+s2+'</b><span>rest</span>'+
   '<button id="r30">+30s</button><button id="rx">Skip</button>';
 el("r30").onclick=function(){restEnd+=30000;drawRest()};
 el("rx").onclick=stopRest}


/* ---------- session summary ---------- */
function setsFilled(r,name){var a=r.sets[name]||[],n=0;
 a.forEach(function(x){if(x&&x.length&&x[0]!==undefined&&String(x[0]).trim()!=="")n++});return n}
function summarise(w,d,day,r){
 var done=0,total=0,ton=0,prs=[],moved=0,notes=[];
 function scan(name,kind,sets){
  total+=sets;
  var rows=r.sets[name]||[];
  for(var i=0;i<sets;i++){
   var a=rows[i];if(!a||!a.length||String(a[0]||"").trim()==="")continue;
   done++;
   var kg=val(a[0]),rp=val(a[1]);
   if(kg!==null&&rp!==null&&kg>0&&rp>0)ton+=kg*rp;
   if(isPR(w,d,name,kind,a))prs.push({n:name,v:a.filter(function(x){return x}).join(" × ")})}
  if(rows.some(function(x){return x&&x.length&&String(x[0]||"").trim()!==""}))moved++;
  var nt=S.exnote[K(w,d)+"|"+name];if(nt)notes.push({n:name,t:nt})}
 day.s.forEach(function(sg){sg.i.forEach(function(it0){
  var it=sub(it0);if(it.k)scan(it.n,it.k,it.s)})});
 (S.extra[K(w,d)]||[]).forEach(function(x,xi){scan("~"+xi,x.k,x.s)});
 var mins=r.el?Math.round(r.el/60):(r.t0?Math.round((Date.now()-r.t0)/60000):0);
 return{done:done,total:total,ton:Math.round(ton),prs:prs,moved:moved,mins:mins,notes:notes}}

function summaryCard(sm,w,d){
 var pct=sm.total?Math.round(sm.done/sm.total*100):0;
 var h='<div class="sumcard"><h4>Session complete</h4><div class="sumgrid">';
 h+='<div><b>'+sm.done+'<i>/'+sm.total+'</i></b><span>sets logged</span></div>';
 h+='<div><b>'+sm.mins+'<i>min</i></b><span>on the clock</span></div>';
 h+='<div><b>'+(sm.ton?sm.ton.toLocaleString():"\u2014")+'<i>kg</i></b><span>total lifted</span></div>';
 h+='<div><b>'+sm.prs.length+'</b><span>personal best'+(sm.prs.length===1?"":"s")+'</span></div>';
 h+='</div>';
 h+='<div class="sumbar"><i style="width:'+pct+'%"></i></div>';
 if(sm.prs.length){
  h+='<p class="sumh">New bests</p>';
  sm.prs.slice(0,6).forEach(function(p){
   h+='<div class="sumr"><b>'+esc(p.n)+'</b><span>'+esc(p.v)+'</span></div>'});
  if(sm.prs.length>6)h+='<div class="sumr"><b>and '+(sm.prs.length-6)+' more</b><span></span></div>'}
 if(sm.notes.length){
  h+='<p class="sumh">Notes you left</p>';
  sm.notes.forEach(function(n){h+='<div class="sumr"><b>'+esc(n.n)+'</b><span>'+esc(n.t)+'</span></div>'})}
 var prev=null;
 for(var pw=w-1;pw>=1&&!prev;pw--){var e=S.log[K(pw,d)];
  if(e&&e.done)prev={w:pw,ton:(function(){var t=0;Object.keys(e.sets).forEach(function(nm){
   e.sets[nm].forEach(function(a){if(!a)return;var kg=val(a[0]),rp=val(a[1]);
    if(kg!==null&&rp!==null&&kg>0&&rp>0)t+=kg*rp})});return Math.round(t)})()}}
 if(prev&&prev.ton&&sm.ton){
  var diff=sm.ton-prev.ton,pc=Math.round(diff/prev.ton*100);
  h+='<p class="sumn">Against the same day in week '+prev.w+': '+
     (diff>=0?"+":"")+diff.toLocaleString()+' kg ('+(pc>=0?"+":"")+pc+'%).</p>'}
 if(sm.done<sm.total)h+='<p class="sumn">'+(sm.total-sm.done)+' sets were left blank \u2014 fine if you cut the finisher, worth a note if not.</p>';
 h+='</div>';return h}

/* ---------- TRAIN ---------- */
var cw=1,cd=1,openHist={};
function inputs(nm,k,saved,si,extraAttr){
 var fs=fields(k),h="";
 fs.forEach(function(f,fi){
  h+='<label>'+f[1]+' <i>'+f[0]+'</i><input type="text" inputmode="'+f[2]+
     '" placeholder="'+(f[0]==="mm:ss"?"0:00":f[0])+'" data-nm="'+esc(nm)+
     '" data-set="'+si+'" data-f="'+fi+'"'+(extraAttr||"")+' value="'+
     esc((saved&&saved[fi])||"")+'"></label>'});
 return h}

var openLH={},openNote={},openSwap={},openMore={},openEx=null;

function exBlock(it0,idx,r,w){
 var it=sub(it0),key=it0.n;
 var filled=setsFilled(r,it.n),full=it.k&&filled>=it.s,part=filled>0&&!full;
 var open=(openEx===key);
 var h='<div class="ex'+(full?" full":"")+(open?" open":"")+'">';
 h+='<button class="exhead" data-open="'+esc(key)+'">'+
    '<span class="exn">'+esc(it.n)+(it.orig?'<em class="swaptag">swapped</em>':"")+'</span>'+
    '<span class="exmeta">'+
      (it.k?'<b class="dot'+(full?" f":(part?" p":""))+'">'+(full?"\u2713":(part?filled+"/"+it.s:it.s+" sets"))+'</b>':"")+
      '<span class="exp">'+esc(it.p)+'</span></span></button>';
 if(!it.k||!open){h+='</div>';return h}

 var tg=tgtFor(it,w);
 if(tg)h+='<p class="tgt"><button class="lhbtn" data-lh="'+esc(key)+'" data-top="'+tg.v+
