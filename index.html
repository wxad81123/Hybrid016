function prog(){
 var h='<h2>Progress</h2><p class="hint">Enter your six 1RMs and every suggested weight in the app — accessories included — calculates from them.</p>'+
  '<div class="chart"><h5>1RM estimates</h5><table><tbody>';
 Object.keys(L).forEach(function(k){
  h+='<tr><td class="nm">'+esc(k)+'</td><td style="width:110px"><input type="text" inputmode="decimal" placeholder="kg" data-rm="'+esc(k)+'" value="'+esc(S.rm[k]||"")+'"></td></tr>'});
 h+='</tbody></table><p class="note">No idea? Take a weight you can do for 5 clean reps and divide by 0.87. Accessory ratios are conventional starting points, not measurements of you.</p></div>';
 var shown=0;
 Object.keys(L).forEach(function(k){var r=spark(k);if(!r.any&&!S.rm[k])return;shown++;
  h+='<div class="chart"><h5>'+esc(k)+'</h5><p>Top set per week · dashed = target</p>'+r.svg+'</div>'});
 if(!shown)h+='<p class="hint">Log a few sessions, or enter a 1RM above, to see charts here.</p>';
 /* weekly tonnage */
 var ton=[],mx=0;
 for(var w2=1;w2<=16;w2++){var t2=tonnage(w2);ton.push(t2);if(t2>mx)mx=t2}
 if(mx>0){
  var top2=niceMax(mx),W2=560,LM2=52,B2=118,TP2=18,sp2=(W2-LM2-8)/16;
  var y2=function(v3){return B2-(v3/top2)*(B2-TP2)};
  var sv='<svg viewBox="0 0 '+W2+' 152" role="img" aria-label="Weekly training tonnage in kilograms">';
  [0,0.5,1].forEach(function(f){var v4=Math.round(top2*f),yy=y2(v4);
   sv+='<line x1="'+LM2+'" y1="'+yy+'" x2="'+W2+'" y2="'+yy+'" stroke="var(--line)" stroke-width="'+(f?0.8:1.3)+'"'+
       (f?' stroke-dasharray="2 3"':'')+'/>';
   sv+='<text x="'+(LM2-6)+'" y="'+(yy+3.5)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--soft)">'+
       (v4>=1000?Math.round(v4/1000)+"t":v4)+'</text>'});
  ton.forEach(function(t3,i){var x=LM2+i*sp2+3,bw=sp2-6;
   if(t3>0){var yy=y2(t3);
    sv+='<rect x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+(B2-yy)+'" rx="2" fill="var(--turf)"/>';
    sv+='<text x="'+(x+bw/2)+'" y="'+(yy-5)+'" text-anchor="middle" font-family="var(--mono)" font-size="8" fill="var(--turf)">'+
        (t3>=1000?(t3/1000).toFixed(1):t3)+'</text>'}
   sv+='<text x="'+(x+bw/2)+'" y="'+(B2+13)+'" text-anchor="middle" font-family="var(--mono)" font-size="8" fill="var(--soft)">'+(i+1)+'</text>'});
  sv+='<text x="'+(LM2-6)+'" y="12" text-anchor="end" font-family="var(--mono)" font-size="8.5" fill="var(--soft)">kg</text>';
  sv+='<text x="'+LM2+'" y="146" font-family="var(--mono)" font-size="9" fill="var(--soft)">bar labels in tonnes above 1,000 kg \u00b7 peak '+
   mx.toLocaleString()+' kg</text></svg>';
  h+='<div class="chart"><h5>Weekly tonnage</h5><p>Weight \u00d7 reps, everything you logged</p>'+sv+'</div>'}
 /* search the log */
 h+='<div class="chart"><h5>Search the log</h5><input type="text" id="lq" class="search" placeholder="e.g. squat, carry, 1 km" value="'+esc(logQ)+'">';
 if(logQ){
  var names={};
  for(var w3=1;w3<=16;w3++)for(var d3=1;d3<=4;d3++){var e3=S.log[K(w3,d3)];if(!e3)continue;
   Object.keys(e3.sets).forEach(function(nm){
    if(nm.toLowerCase().indexOf(logQ.toLowerCase())<0)return;
    var rows=e3.sets[nm].filter(function(a){return a&&a.some(function(v){return v})});
    if(!rows.length)return;
    if(!names[nm])names[nm]=[];
    names[nm].push({w:w3,d:d3,rows:e3.sets[nm]})})}
  var ks=Object.keys(names);
  if(!ks.length)h+='<p class="hint">Nothing logged matches that yet.</p>';
  ks.forEach(function(nm){
   h+='<p class="lqn">'+esc(nm)+'</p><div class="hist">';
   names[nm].reverse().forEach(function(e4){
    h+='<div class="histr"><b>Wk '+e4.w+' D'+e4.d+'</b> '+
       e4.rows.map(function(a){return (a&&a.length)?a.filter(function(v){return v}).join(" × "):"—"}).join("  ·  ")+'</div>'});
   h+='</div>'})}
 h+='</div>';
 /* weekly readiness */
 h+='<div class="chart"><h5>Weekly check</h5><p>Two questions · catches a deficit eating your training</p><table><tbody>';
 for(var w4=1;w4<=16;w4++){
  var rd=S.ready[w4]||{};
  h+='<tr><td class="nm">Wk '+w4+'</td>'+
     '<td><select data-rd="'+w4+'" data-rk="s"><option value="">sleep</option>'+
     [1,2,3,4,5].map(function(v){return '<option value="'+v+'"'+(String(rd.s)===String(v)?" selected":"")+'>'+v+'</option>'}).join("")+'</select></td>'+
     '<td><select data-rd="'+w4+'" data-rk="b"><option value="">bar felt</option>'+
     [1,2,3,4,5].map(function(v){return '<option value="'+v+'"'+(String(rd.b)===String(v)?" selected":"")+'>'+v+'</option>'}).join("")+'</select></td></tr>'}
 h+='</tbody></table><p class="note">Sleep: 1 poor to 5 excellent. Bar felt: 1 light to 5 crushing. Two weeks of low sleep with a heavy bar is the signal to eat more, not train harder.</p></div>';
 h+='<div class="chart"><h5>Bodyweight</h5><table><tbody>';
 for(var i=1;i<=8;i++)h+='<tr><td class="nm">Wk '+i+'</td><td><input type="text" inputmode="decimal" placeholder="kg" data-wt="'+i+'" value="'+esc(S.wt[i]||"")+'"></td>'+
   '<td class="nm">Wk '+(i+8)+'</td><td><input type="text" inputmode="decimal" placeholder="kg" data-wt="'+(i+8)+'" value="'+esc(S.wt[i+8]||"")+'"></td></tr>';
 h+='</tbody></table></div>';
 h+='<div class="chart"><h5>Benchmarks</h5><p>Week 1, the week 8 deload, then fully in week 16</p>'+
   '<table><thead><tr><th style="width:38%">Test</th><th>Wk 1</th><th>Wk 8</th><th>Wk 16</th></tr></thead><tbody>';
 T.forEach(function(t,i){var v=S.tests[i]||{};
  h+='<tr><td class="nm">'+esc(t[0])+'<span class="u">'+esc(t[1])+' \u00b7 '+esc(t[2])+' is better</span></td>';
  ["a","b","c"].forEach(function(k2){
   h+='<td><input type="text" inputmode="decimal" placeholder="\u2014" data-t="'+i+'" data-k="'+k2+'" value="'+esc(v[k2]||"")+'"></td>'});
  h+='</tr>'});
 h+='</tbody></table></div>';
 h+='<p class="saved" id="flash"></p>';
 el("v-prog").innerHTML=h;flash=el("flash");
 Array.prototype.forEach.call(el("v-prog").querySelectorAll("[data-t]"),function(i){
  i.addEventListener("input",function(){var n2=i.getAttribute("data-t");
   if(!S.tests[n2])S.tests[n2]={};S.tests[n2][i.getAttribute("data-k")]=i.value.trim();queue()})});
 Array.prototype.forEach.call(el("v-prog").querySelectorAll("[data-rm]"),function(i){
  i.addEventListener("input",function(){S.rm[i.getAttribute("data-rm")]=i.value.trim();queue()});
  i.addEventListener("change",prog)});
 Array.prototype.forEach.call(el("v-prog").querySelectorAll("[data-wt]"),function(i){
  i.addEventListener("input",function(){S.wt[i.getAttribute("data-wt")]=i.value.trim();queue()})});
 var lq=el("lq");
 if(lq)lq.addEventListener("change",function(){logQ=lq.value.trim();prog();
   var f=el("lq");if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}});
 Array.prototype.forEach.call(el("v-prog").querySelectorAll("[data-rd]"),function(sl){
  sl.addEventListener("change",function(){var w5=sl.getAttribute("data-rd");
   if(!S.ready[w5])S.ready[w5]={};S.ready[w5][sl.getAttribute("data-rk")]=sl.value;queue()})})}

/* ---------- DATA ---------- */
function data(){
 var n=0;for(var k in S.log)n++;
 var h='<h2>Your data</h2><p class="hint">Everything lives in this browser on this device. Nothing is sent anywhere and there is no account.</p>'+
  '<p class="stat"><span>Sessions with entries</span><b>'+n+'</b></p>'+
  '<div class="row"><button class="act" id="exp">Export backup</button>'+
  '<button class="act" id="csv">Export CSV</button>'+
  '<button class="act" id="impb">Import backup</button>'+
  '<input type="file" id="imp" accept="application/json,.json" style="display:none"></div>'+
  '<div class="warnbox"><p><b>Fields.</b> Each movement asks for what is actually worth recording: weight and reps for lifts, distance for timed erg intervals, time for prescribed distances, seconds for timed drills. Assistance goes in as a negative.</p>'+
  '<p><b>Export every few weeks.</b> Clearing browser data will erase the log. The backup is a small file — email it to yourself or drop it in your cloud drive.</p></div>'+
  '<h5 style="font-family:var(--disp);text-transform:var(--tt);font-size:18px;margin:18px 0 2px">Your bar and plates</h5>'+
  '<p class="hint">Used by the plate calculator on every suggested weight.</p>'+
  '<div class="row"><label class="sel">Bar kg <input type="text" inputmode="decimal" id="barw" value="'+esc(S.bar)+'" style="width:70px"></label>'+
  '<label class="sel">Plates <input type="text" id="platesw" value="'+esc(S.plates)+'" style="flex:1;min-width:150px"></label></div>'+
  '<h5 style="font-family:var(--disp);text-transform:var(--tt);font-size:18px;margin:18px 0 2px">Look</h5>'+
  '<p class="hint">Auto follows your phone\u2019s light or dark setting and is the default. The rest override it.</p>'+
  '<div class="themes">'+THEMES.map(function(t){
    var sw={"":"#8C2F1E","track":"#8C2F1E","carbon":"#F0784A","press":"#94202A","court":"#C24708"}[t[0]];
    var bg={"":"#DDE1DC","track":"#DDE1DC","carbon":"#14171A","press":"#F3EFE6","court":"#E3E8EC"}[t[0]];
    if(t[0]==="")bg="linear-gradient(90deg,#DDE1DC 50%,#14171A 50%)";
    return '<button data-th="'+t[0]+'" aria-pressed="'+(S.theme===t[0]?"true":"false")+
      '"><i style="background:'+sw+'"></i><u style="display:block;height:7px;margin:-4px 0 7px;background:'+bg+';border:1px solid var(--line)"></u>'+t[1]+'</button>'}).join("")+'</div>'+
  '<div class="row"><button class="act warn" id="clr">Erase everything</button></div>'+
  '<p class="saved" id="flash"></p>';
 el("v-data").innerHTML=h;flash=el("flash");
 function dl(txt,name,type){var b=new Blob([txt],{type:type});var a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
 el("exp").onclick=function(){dl(JSON.stringify(S,null,1),
  "hybrid16-backup-"+new Date().toISOString().slice(0,10)+".json","application/json");say("Backup downloaded")};
 el("csv").onclick=function(){
  var rows=[["week","day","date","exercise","set","f1","f2"]];
  for(var w=1;w<=16;w++)for(var d=1;d<=4;d++){var e=S.log[K(w,d)];if(!e)continue;
   for(var nm in e.sets)e.sets[nm].forEach(function(a,si){
    if(a&&a.some(function(x){return x}))rows.push([w,d,e.date||"",nm,si+1,a[0]||"",a[1]||""])})}
  dl(rows.map(function(r){return r.map(function(c){
   return /[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c}).join(",")}).join("\n"),
   "hybrid16-log.csv","text/csv");say("CSV downloaded")};
 el("barw").addEventListener("input",function(){S.bar=this.value.trim();queue()});
 el("platesw").addEventListener("input",function(){S.plates=this.value.trim();queue()});
 Array.prototype.forEach.call(el("v-data").querySelectorAll("[data-th]"),function(bn){
  bn.onclick=function(){S.theme=bn.getAttribute("data-th");applyTheme();save();data()}});
 el("impb").onclick=function(){el("imp").click()};
 el("imp").onchange=function(){var f=this.files&&this.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){try{var p=JSON.parse(fr.result);if(!p||typeof p!=="object")throw 0;
   ["log","tests","wt","rm","extra","sub","exnote","ready"].forEach(function(k){S[k]=p[k]||{}});
   save();say("Backup restored");train()}catch(e){say("That file could not be read as a backup",1)}};
  fr.readAsText(f)};
 el("clr").onclick=function(){
  if(!confirm("Erase every logged set, test and weight on this device? This cannot be undone."))return;
  S.log={};S.tests={};S.wt={};S.rm={};S.extra={};S.sub={};S.exnote={};S.ready={};save();say("Everything erased");train()}}

/* ---------- nav ---------- */
var VIEWS=["train","guide","plan","prog","data"];
function show(v){VIEWS.forEach(function(x){el("v-"+x).className=(x===v?"on":"")});
 Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
  b.setAttribute("aria-current",b.getAttribute("data-v")===v?"true":"false")});
 ({train:train,guide:guide,plan:plan,prog:prog,data:data})[v]();
 checkContrast();
 if(v!=="guide")window.scrollTo(0,0)}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){
 b.onclick=function(){show(b.getAttribute("data-v"))}});

function checkContrast(){
 var w=document.getElementById("surface");if(!w)return;
 var light=(S.theme&&S.theme!=="carbon")||(!S.theme&&!sysDark());
 var bad=light&&hostDark();
 var old=document.getElementById("cwarn");if(old)old.parentNode.removeChild(old);
 if(!bad)return;
 var d=document.createElement("div");
 d.id="cwarn";d.className="cwarn";
 d.innerHTML='<p>This viewer is forcing a dark background while a light theme is selected, so text may be hard to read.</p>'+
  '<button class="act" id="cfix">Switch to Carbon</button>';
 var wrap=document.querySelector(".wrap");
 wrap.insertBefore(d,wrap.firstChild.nextSibling);
 document.getElementById("cfix").onclick=function(){S.theme="carbon";applyTheme();save();
  var cur=document.querySelector('nav button[aria-current="true"]');
  show(cur?cur.getAttribute("data-v"):"train")}}

load();
applyTheme();
try{localStorage.setItem(KEY+"-p","1");localStorage.removeItem(KEY+"-p")}
catch(e){alert("This browser is blocking local storage, so nothing will save. Turn off Private Browsing and reopen the app.")}
outer:for(var w2=16;w2>=1;w2--)for(var d2=4;d2>=1;d2--){var e2=S.log[K(w2,d2)];
 if(e2&&(e2.done||e2.note||Object.keys(e2.sets).length)){cw=w2;cd=d2;break outer}}
train();
})();

</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
